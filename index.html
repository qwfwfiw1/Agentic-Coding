<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qwfwfiw1 - GitHub 個人首頁與儲存庫介紹</title>
    <meta name="description" content="歡迎來到 qwfwfiw1 的 GitHub 介紹首頁，此處動態展示了所有的 GitHub 公開儲存庫、統計數據以及專案介紹。">
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* CSS 變數定義，實現極致的深淺色主題切換 */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
            --card-bg: rgba(30, 41, 59, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-border: rgba(99, 102, 241, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --accent-gradient: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
            --header-bg: rgba(15, 23, 42, 0.6);
            --skeleton-bg: #1e293b;
            --skeleton-highlight: #334155;
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --pill-bg: rgba(255, 255, 255, 0.05);
            --pill-hover-bg: rgba(255, 255, 255, 0.1);
            --pill-active-bg: #6366f1;
            --pill-active-text: #ffffff;
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #eff6ff 50%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(0, 0, 0, 0.06);
            --card-hover-border: rgba(99, 102, 241, 0.3);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.1);
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --header-bg: rgba(255, 255, 255, 0.5);
            --skeleton-bg: #e2e8f0;
            --skeleton-highlight: #cbd5e1;
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
            --pill-bg: rgba(0, 0, 0, 0.05);
            --pill-hover-bg: rgba(0, 0, 0, 0.08);
            --pill-active-bg: #4f46e5;
            --pill-active-text: #ffffff;
        }

        /* 基礎重設 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, .font-outfit {
            font-family: 'Outfit', sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* 頁首毛玻璃導覽列 */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--card-border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo i {
            stroke: #818cf8;
        }

        .theme-toggle {
            background: var(--pill-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.6rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .theme-toggle:hover {
            background: var(--pill-hover-bg);
            transform: scale(1.05);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        /* 主體佈局 */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* 個人 Profile 卡片 - 毛玻璃效果 */
        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem;
            margin-bottom: 3rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* 背景裝飾發光圈 */
        .profile-card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 200px;
            height: 200px;
            background: var(--accent);
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .profile-card-content {
            display: flex;
            align-items: center;
            gap: 2.5rem;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .profile-card-content {
                flex-direction: column;
                text-align: center;
            }
        }

        .avatar-container {
            position: relative;
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            object-fit: cover;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 768px) {
            .profile-name-row {
                justify-content: center;
                flex-wrap: wrap;
            }
        }

        .profile-name {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .github-badge {
            background: var(--accent-gradient);
            color: #fff;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .profile-username {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        @media (max-width: 768px) {
            .profile-username {
                justify-content: center;
            }
        }

        .profile-bio {
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
            max-width: 700px;
        }

        /* 個人統計數據 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 1rem;
            width: 100%;
            border-top: 1px solid var(--card-border);
            padding-top: 1.5rem;
            z-index: 1;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* 搜尋與篩選區域 */
        .controls-section {
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .search-bar-container {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            padding: 1rem 1rem 1rem 3.25rem;
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 1.05rem;
            outline: none;
            box-shadow: var(--shadow);
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* 篩選標籤列表 */
        .filters-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .filter-pill {
            background: var(--pill-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 0.4rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .filter-pill:hover {
            background: var(--pill-hover-bg);
            color: var(--text-primary);
        }

        .filter-pill.active {
            background: var(--pill-active-bg);
            color: var(--pill-active-text);
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .lang-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        /* 排序選單 */
        .sort-select-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .sort-select {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            outline: none;
            font-weight: 500;
            cursor: pointer;
        }

        /* 儲存庫卡片網格 */
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        /* 儲存庫卡片 */
        .repo-card {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.75rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            height: 240px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .repo-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: transparent;
            transition: background 0.3s ease;
        }

        .repo-card:hover {
            transform: translateY(-8px);
            border-color: var(--card-hover-border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15), 0 0 15px var(--accent-glow);
        }

        .repo-card:hover::after {
            background: var(--accent-gradient);
        }

        .repo-top {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .repo-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .repo-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-all;
            line-height: 1.3;
        }

        .repo-icon {
            color: var(--accent);
            flex-shrink: 0;
        }

        .repo-description {
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 0.4rem;
        }

        .repo-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1rem;
        }

        .repo-meta {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .repo-meta-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .repo-meta-item i {
            width: 14px;
            height: 14px;
        }

        .repo-link-btn {
            background: var(--pill-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.4rem 0.8rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .repo-card:hover .repo-link-btn {
            background: var(--accent-gradient);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 10px var(--accent-glow);
        }

        /* 骨架屏 (Skeleton Screen) 載入動畫 */
        .skeleton {
            background: linear-gradient(
                90deg,
                var(--skeleton-bg) 25%,
                var(--skeleton-highlight) 37%,
                var(--skeleton-bg) 63%
            );
            background-size: 400% 100%;
            animation: skeleton-loading 1.4s ease infinite;
        }

        @keyframes skeleton-loading {
            0% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .skeleton-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
        }

        .skeleton-text {
            height: 1.2rem;
            border-radius: 4px;
            margin-bottom: 0.6rem;
        }

        .skeleton-title {
            width: 200px;
            height: 2rem;
            border-radius: 6px;
        }

        .skeleton-bio {
            width: 80%;
            height: 1rem;
        }

        .skeleton-repo-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1.75rem;
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .skeleton-repo-title {
            width: 60%;
            height: 1.4rem;
        }

        .skeleton-repo-desc1 {
            width: 100%;
            height: 0.9rem;
            margin-top: 1rem;
        }

        .skeleton-repo-desc2 {
            width: 90%;
            height: 0.9rem;
        }

        .skeleton-repo-desc3 {
            width: 75%;
            height: 0.9rem;
        }

        /* 錯誤/無儲存庫顯示 */
        .error-message, .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .error-message i, .no-results i {
            font-size: 3rem;
            color: var(--accent);
        }

        /* 頁尾 */
        footer {
            text-align: center;
            padding: 2.5rem 1.5rem;
            border-top: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 0.9rem;
            background: rgba(15, 23, 42, 0.2);
        }

        footer strong {
            color: var(--text-secondary);
        }

        .refresh-btn {
            background: var(--pill-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            margin-top: 0.5rem;
        }

        .refresh-btn:hover {
            background: var(--pill-hover-bg);
            border-color: var(--accent);
        }
    </style>
</head>
<body>

    <!-- 頁首導覽列 -->
    <header>
        <div class="logo font-outfit">
            <i data-lucide="code-xml"></i>
            <span>Agentic Portfolio</span>
        </div>
        <button class="theme-toggle" id="theme-btn" title="切換深/淺色模式" aria-label="切換深/淺色模式">
            <i data-lucide="moon" id="theme-icon"></i>
        </button>
    </header>

    <!-- 主體內容 -->
    <main class="container">
        
        <!-- 個人 Profile 卡片 -->
        <section class="profile-card" id="profile-section">
            <div class="profile-card-content">
                <!-- 骨架屏載入狀態 -->
                <div class="skeleton skeleton-avatar" id="profile-skeleton-avatar"></div>
                <div class="profile-info" id="profile-info-container">
                    <div class="skeleton skeleton-title" style="margin-bottom: 0.8rem;"></div>
                    <div class="skeleton skeleton-text" style="width: 150px; margin-bottom: 1.2rem;"></div>
                    <div class="skeleton skeleton-bio" style="margin-bottom: 0.5rem;"></div>
                    <div class="skeleton skeleton-bio" style="width: 60%;"></div>
                </div>
            </div>
            <!-- 統計數據 -->
            <div class="stats-grid" id="stats-container">
                <div class="stat-item"><div class="skeleton skeleton-text" style="width: 40px; margin: 0 auto 0.3rem;"></div><div class="stat-label">儲存庫</div></div>
                <div class="stat-item"><div class="skeleton skeleton-text" style="width: 40px; margin: 0 auto 0.3rem;"></div><div class="stat-label">追隨者</div></div>
                <div class="stat-item"><div class="skeleton skeleton-text" style="width: 40px; margin: 0 auto 0.3rem;"></div><div class="stat-label">追隨中</div></div>
                <div class="stat-item"><div class="skeleton skeleton-text" style="width: 40px; margin: 0 auto 0.3rem;"></div><div class="stat-label">Gists</div></div>

        </section>

        <!-- 搜尋與篩選區塊 -->
        <section class="controls-section">
            <div class="search-bar-container">

        <!-- 排序與儲存庫清單標題 -->
        <div class="sort-select-container">

            </div>
            <div class="skeleton-repo-card">

                    <div class="skeleton skeleton-repo-desc1"></div>
                    <div class="skeleton skeleton-repo-desc2"></div>
                    <div class="skeleton skeleton-repo-desc3"></div>
                </div>
                <div class="skeleton skeleton-text" style="width: 100px; height: 1.5rem; margin-bottom: 0;"></div>
            </div>
            <div class="skeleton-repo-card">
                <div>
                    <div class="skeleton skeleton-repo-title"></div>

                    <div class="skeleton skeleton-repo-desc3"></div>
                </div>
                <div class="skeleton skeleton-text" style="width: 100px; height: 1.5rem; margin-bottom: 0;"></div>
            </div>
            <div class="skeleton-repo-card">
                <div>
                    <div class="skeleton skeleton-repo-title"></div>
                    <div class="skeleton skeleton-repo-desc1"></div>
                    <div class="skeleton skeleton-repo-desc2"></div>
                    <div class="skeleton skeleton-repo-desc3"></div>
                </div>
                <div class="skeleton skeleton-text" style="width: 100px; height: 1.5rem; margin-bottom: 0;"></div>
            </div>
            <div class="skeleton-repo-card">
                <div>
                    <div class="skeleton skeleton-repo-title"></div>
                    <div class="skeleton skeleton-repo-desc1"></div>
                    <div class="skeleton skeleton-repo-desc2"></div>
                    <div class="skeleton skeleton-repo-desc3"></div>
                </div>
                <div class="skeleton skeleton-text" style="width: 100px; height: 1.5rem; margin-bottom: 0;"></div>
            </div>
        </section>

    </main>

    <!-- 頁尾 -->
    <footer>
        <p>&copy; <span id="year"></span> <strong>qwfwfiw1</strong>. 版權所有。由 AI 助理優雅構建。</p>
        <p style="font-size: 0.8rem; margin-top: 0.5rem;">動態介接 GitHub REST API，資料即時同步。</p>
        <button class="refresh-btn" onclick="fetchGitHubData()" title="重新載入 GitHub API 資料">
            <i data-lucide="refresh-cw" style="width: 12px; height: 12px;"></i>手動重新載入
        </button>
    </footer>

    <!-- 主控 JS 邏輯 -->
    <script>
        // 設定當前年份
        document.getElementById('year').textContent = new Date().getFullYear();

        // 目標 GitHub 使用者
        const GITHUB_USERNAME = 'qwfwfiw1';

        // 全域變數快取 API 資料
        let cachedRepos = [];
        let cachedProfile = {};
        let activeLanguage = 'all';

        // GitHub 官方語言色標 (常規語言)
        const LANGUAGE_COLORS = {
            'JavaScript': '#f1e05a',
            'TypeScript': '#3178c6',
            'Python': '#3572A5',
            'HTML': '#e34c26',
            'CSS': '#563d7c',
            'Go': '#00ADD8',
            'Java': '#b07219',
            'C++': '#f34b7d',
            'C#': '#178600',
            'Ruby': '#701516',
            'Shell': '#89e051',
            'Vue': '#41b883',
            'PHP': '#4F5D95',
            'Rust': '#dea584'
        };

        // 深淺色主題切換控制
        const themeBtn = document.getElementById('theme-btn');
        const themeIcon = document.getElementById('theme-icon');
        
        // 優先從 localStorage 取得主題，否則使用系統預設
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
            document.documentElement.setAttribute('data-theme', 'light');
            themeIcon.setAttribute('data-lucide', 'sun');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeIcon.setAttribute('data-lucide', 'moon');
        }
        lucide.createIcons(); // 更新圖示

        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            let newTheme = 'dark';
            
            if (currentTheme === 'dark') {
                newTheme = 'light';
                document.documentElement.setAttribute('data-theme', 'light');
                themeIcon.setAttribute('data-lucide', 'sun');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.setAttribute('data-lucide', 'moon');
            }
            
            localStorage.setItem('theme', newTheme);
            lucide.createIcons(); // 更新圖示
        });

        // 初始化載入 GitHub 資料
        async function fetchGitHubData() {
            showSkeletons();
            try {
                // 1. 同步獲取 Profile 和 Repos
                const [profileRes, reposRes] = await Promise.all([
                    fetch(`https://api.github.com/users/${GITHUB_USERNAME}`),
                    fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100`)
                ]);

                if (!profileRes.ok || !reposRes.ok) {
                    throw new Error('API 請求失敗，可能是超出 GitHub API rate limit 或是使用者不存在！');
                }

                cachedProfile = await profileRes.json();
                cachedRepos = await reposRes.json();

                // 2. 渲染頁面
                renderProfile(cachedProfile);
                renderRepos();
                renderLanguageFilters();

                // 3. 啟用搜尋輸入框與排序選單
                document.getElementById('search-input').removeAttribute('disabled');
                document.getElementById('sort-select').removeAttribute('disabled');

            } catch (error) {
                console.error(error);
                renderError(error.message);
            }
        }

        // 顯示骨架屏
        function showSkeletons() {
            // 骨架屏已在 HTML 中預設顯示，此處為重置用途
            document.getElementById('repo-grid').innerHTML = Array(6).fill(`
                <div class="skeleton-repo-card">
                    <div>
                        <div class="skeleton skeleton-repo-title"></div>
                        <div class="skeleton skeleton-repo-desc1"></div>
                        <div class="skeleton skeleton-repo-desc2"></div>
                        <div class="skeleton skeleton-repo-desc3"></div>
                    </div>
                    <div class="skeleton skeleton-text" style="width: 100px; height: 1.5rem; margin-bottom: 0;"></div>
                </div>
            `).join('');
        }

        // 渲染個人資料卡片
        function renderProfile(profile) {
            const profileSection = document.getElementById('profile-section');
            
            profileSection.innerHTML = `
                <div class="profile-card-content">
                    <div class="avatar-container">
                        <img src="${profile.avatar_url}" alt="${profile.name || profile.login}" class="avatar">
                    </div>
                    <div class="profile-info">
                        <div class="profile-name-row">
                            <h1 class="profile-name">${profile.name || profile.login}</h1>
                            <span class="github-badge">GitHub Pro</span>
                        </div>
                        <div class="profile-username">
                            <i data-lucide="github" style="width: 16px; height: 16px;"></i>
                            <a href="${profile.html_url}" target="_blank">@${profile.login}</a>
                        </div>
                        <p class="profile-bio">${profile.bio || '這位工程師很懶，還沒有留下任何個人簡介。'}</p>
                    </div>
                </div>
                <!-- 統計數據 -->
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value">${profile.public_repos}</span>
                        <span class="stat-label">儲存庫</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value">${profile.followers}</span>
                        <span class="stat-label">追隨者</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value">${profile.following}</span>
                        <span class="stat-label">追隨中</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value">${profile.public_gists}</span>
                        <span class="stat-label">Gists</span>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // 渲染程式語言篩選按鈕
        function renderLanguageFilters() {
            const filtersContainer = document.getElementById('filters-container');
            
            // 統計所有不重複的語言
            const languages = new Set();
            cachedRepos.forEach(repo => {
                if (repo.language) {
                    languages.add(repo.language);
                }
            });

            // 清空除「全部」之外的標籤
            filtersContainer.innerHTML = `<span class="filter-label">依程式語言篩選：</span>
                <button class="filter-pill active" data-lang="all">全部</button>`;

            // 動態添加語言標籤
            languages.forEach(lang => {
                const color = LANGUAGE_COLORS[lang] || '#8b5cf6'; // 預設紫色
                const btn = document.createElement('button');
                btn.className = 'filter-pill';
                btn.setAttribute('data-lang', lang);
                btn.innerHTML = `<span class="lang-dot" style="background-color: ${color}"></span>${lang}`;
                filtersContainer.appendChild(btn);
            });

            // 綁定點擊事件
            const pills = document.querySelectorAll('.filter-pill');
            pills.forEach(pill => {
                pill.addEventListener('click', (e) => {
                    pills.forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    activeLanguage = pill.getAttribute('data-lang');
                    renderRepos();
                });
            });
        }

        // 渲染儲存庫網格卡片
        function renderRepos() {
            const repoGrid = document.getElementById('repo-grid');
            const searchVal = document.getElementById('search-input').value.toLowerCase().trim();
            const sortVal = document.getElementById('sort-select').value;

            // 1. 進行篩選 (語言 + 關鍵字)
            let filteredRepos = cachedRepos.filter(repo => {
                // 不要顯示跟使用者同名的 README profile 倉庫（通常描述或名稱與用戶名完全一致，可看需求決定是否過濾）
                if (repo.name.toLowerCase() === GITHUB_USERNAME.toLowerCase()) {
                    // 保留或排除？通常可以保留，這裡決定保留
                }
                
                const matchesLanguage = activeLanguage === 'all' || repo.language === activeLanguage;
                const matchesSearch = repo.name.toLowerCase().includes(searchVal) || 
                                     (repo.description && repo.description.toLowerCase().includes(searchVal));
                
                return matchesLanguage && matchesSearch;
            });

            // 2. 進行排序
            if (sortVal === 'stars') {
                filteredRepos.sort((a, b) => b.stargazers_count - a.stargazers_count);
            } else if (sortVal === 'updated') {
                filteredRepos.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            } else if (sortVal === 'name') {
                filteredRepos.sort((a, b) => a.name.localeCompare(b.name));
            }

            // 3. 渲染 HTML
            if (filteredRepos.length === 0) {
                repoGrid.innerHTML = `
                    <div class="no-results">
                        <i data-lucide="search-code"></i>
                        <h3>沒有找到符合條件的儲存庫</h3>
                        <p>試試輸入其他關鍵字或變更語言篩選條件。</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            repoGrid.innerHTML = '';
            filteredRepos.forEach((repo, index) => {
                const color = LANGUAGE_COLORS[repo.language] || '#6b7280';
                const card = document.createElement('article');
                card.className = 'repo-card';
                card.style.animationDelay = `${index * 0.05}s`; // 卡片序列淡入效果

                card.innerHTML = `
                    <div class="repo-top">
                        <div class="repo-title-row">
                            <h3 class="repo-name">${repo.name}</h3>
                            <i data-lucide="folder" class="repo-icon"></i>
                        </div>
                        <p class="repo-description" title="${repo.description || '無專案描述'}">
                            ${repo.description || '這個專案尚未提供詳細的說明與描述。'}
                        </p>
                    </div>
                    <div class="repo-bottom">
                        <div class="repo-meta">
                            ${repo.language ? `
                                <div class="repo-meta-item">
                                    <span class="lang-dot" style="background-color: ${color}"></span>
                                    <span>${repo.language}</span>
                                </div>
                            ` : ''}
                            <div class="repo-meta-item" title="${repo.stargazers_count} 個星標">
                                <i data-lucide="star"></i>
                                <span>${repo.stargazers_count}</span>
                            </div>
                            <div class="repo-meta-item" title="${repo.forks_count} 次分支">
                                <i data-lucide="git-fork"></i>
                                <span>${repo.forks_count}</span>
                            </div>
                        </div>
                        <a href="${repo.html_url}" target="_blank" class="repo-link-btn">
                            <span>瀏覽</span>
                            <i data-lucide="external-link" style="width: 14px; height: 14px;"></i>
                        </a>
                    </div>
                `;
                repoGrid.appendChild(card);
            });
            lucide.createIcons();
        }

        // 渲染 API 錯誤訊息頁面
        function renderError(message) {
            const container = document.querySelector('main');
            container.innerHTML = `
                <div class="error-message">
                    <i data-lucide="alert-octagon" style="width: 64px; height: 64px; stroke: #ef4444;"></i>
                    <h2 class="font-outfit" style="color: var(--text-primary);">無法獲取 GitHub 資料</h2>
                    <p style="max-width: 500px; color: var(--text-secondary); margin: 0 auto 1rem;">
                        ${message}<br><br>
                        如果您是首次使用或已達到 GitHub API 限制，建議稍候再試。您也可以直接瀏覽使用者個人頁面。
                    </p>
                    <div style="display: flex; gap: 1rem;">
                        <a href="https://github.com/${GITHUB_USERNAME}" target="_blank" class="repo-link-btn" style="background: var(--accent-gradient); color:#fff; border:none; padding: 0.6rem 1.2rem;">
                            <i data-lucide="github"></i>前往 GitHub 個人頁面
                        </a>
                        <button class="repo-link-btn" onclick="location.reload()" style="padding: 0.6rem 1.2rem;">
                            <i data-lucide="refresh-cw"></i>重新嘗試
                        </button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // 綁定事件監聽器
        document.getElementById('search-input').addEventListener('input', renderRepos);
        document.getElementById('sort-select').addEventListener('change', renderRepos);

        // 啟動執行
        fetchGitHubData();
    </script>
</body>
</html>
